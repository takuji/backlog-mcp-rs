[package]
name = "backlog-mcp"
version = "0.3.0"
edition = "2024"

[dependencies]
backlog-api-rs = { git = "https://github.com/takuji/backlog-api-rs.git", default-features = false }
rmcp = { version = "2.2", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "net"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "6"

[dev-dependencies]
rmcp = { version = "2.2", features = ["client", "transport-streamable-http-client-reqwest"] }
wiremock = "0.6"

[features]
default = ["native-tls"]
native-tls = ["backlog-api-rs/native-tls"]
rustls-tls = ["backlog-api-rs/rustls-tls"]
